services:
  app:
    build: .
    container_name: biblioteca-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:postgresql://db:5432/biblioteca"
      DB_USER: "biblioteca"
      DB_PASS: "biblioteca123"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - biblioteca-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: biblioteca-db
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - biblioteca-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  biblioteca-network:
    driver: bridge

volumes:
  pgdata:
